spring.datasource.url=jdbc:h2:mem:greenbite;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

ai.ark.base-url=http://localhost
ai.ark.api-key=test-key
ai.ark.model=test-model
ai.ark.protocol=responses
