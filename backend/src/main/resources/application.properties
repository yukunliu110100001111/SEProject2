ai.ark.base-url=${AI_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
ai.ark.api-key=${AI_ARK_API_KEY:}
ai.ark.fallback-api-key=13c42d55-c39d-4104-a266-20884b3f20f2
ai.ark.model=${AI_ARK_MODEL:doubao-seed-2-0-pro-260215}
