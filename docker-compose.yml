services:
  postgres:
    image: postgres:15-alpine
    container_name: meal_db
    environment:
      POSTGRES_DB: meal_recommendation
      POSTGRES_USER: meal_user
      POSTGRES_PASSWORD: meal_password
      # Optional: set timezone
      TZ: Asia/Shanghai
    ports:
      - "55432:5432"
    volumes:
      # Mount the initialization SQL script
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      # Mount data volume for persistence
      - meal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meal_user -d meal_recommendation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meal_network

  backend:
    build:
      context: ./backend
    container_name: meal_backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meal_recommendation
      SPRING_DATASOURCE_USERNAME: meal_user
      SPRING_DATASOURCE_PASSWORD: meal_password
      AI_ARK_API_KEY: ${AI_ARK_API_KEY:-}
      AI_ARK_MODEL: ${AI_ARK_MODEL:-doubao-seed-2-0-pro-260215}
      AI_ARK_BASE_URL: ${AI_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - meal_network

  frontend:
    build:
      context: ./frontend
    container_name: meal_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - meal_network

volumes:
  meal_db_data:
    driver: local
  uploads_data:
    driver: local

networks:
  meal_network:
    driver: bridge
